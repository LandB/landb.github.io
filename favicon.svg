<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 48 48">
  <!-- The Couples Cycle mark ("Knockout"): her circle behind, her partner's in front, with a gap. -->
  <style>
    .tracker { fill: #223B6C; } .partner { fill: #E39385; }
    @media (prefers-color-scheme: dark) { .tracker { fill: #91ABDC; } .partner { fill: #DC8C7F; } }
  </style>
  <mask id="gap">
    <rect x="0" y="0" width="56" height="56" fill="#fff"/>
    <circle cx="35" cy="28" r="17.5" fill="#000"/>
  </mask>
  <circle class="tracker" cx="21" cy="28" r="16" mask="url(#gap)"/>
  <circle class="partner" cx="35" cy="28" r="16"/>
</svg>
